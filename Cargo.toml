[workspace]
resolver = "2"
members = [
    "crates/dict-core",
    "crates/dict-db",
    "crates/dict-app",
    "tools/import_cedict",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
jieba-rs = { version = "0.7", features = ["default-dict"] }
cedict = "0.3"
dirs = "6"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
